name: Deploy to Hetzner

on:
  push:
    branches: [main]

env:
  HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
  HETZNER_USER: ${{ secrets.HETZNER_USER }}

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install + smoke test
        run: |
          pip install -r requirements.txt
          pytest -k smoke || true
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Deploy backend
        run: |
          ssh -o StrictHostKeyChecking=no $HETZNER_USER@$HETZNER_HOST <<'EOF'
            set -e
            cd /srv/messaging-app
            git fetch --all --prune
            git checkout main
            git pull
            source venv/bin/activate
            pip install -r api/requirements.txt
            alembic upgrade head
            systemctl restart messaging-backend
          EOF

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Upload dist
        run: |
          tar -czf dist.tar.gz dist
          scp -o StrictHostKeyChecking=no dist.tar.gz $HETZNER_USER@$HETZNER_HOST:/tmp/frontend.tar.gz
      - name: Deploy frontend
        run: |
          ssh -o StrictHostKeyChecking=no $HETZNER_USER@$HETZNER_HOST <<'EOF'
            set -e
            rm -rf /var/www/messaging-app/*
            tar -xzf /tmp/frontend.tar.gz -C /var/www/messaging-app --strip-components=1
            rm /tmp/frontend.tar.gz
            systemctl reload nginx
          EOF
